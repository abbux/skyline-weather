<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline — weather you can scrub through</title>
<meta name="description" content="Drag through the day and watch the sky change. Live forecasts powered by Open-Meteo.">
<style>
@property --glow-a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
:root {
  color-scheme: dark;
  --accent: oklch(82% .14 75);
  --ink: oklch(98% .01 250);
  --ink-dim: color-mix(in oklch, var(--ink) 66%, transparent);
  --glass: color-mix(in oklch, oklch(20% .03 260) 42%, transparent);
  --glass-line: color-mix(in oklch, white 18%, transparent);
  --r: 22px;
  --fs-hero: clamp(5rem, 4rem + 9vw, 11rem);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  font-family: ui-rounded, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body { min-height: 100dvh; color: var(--ink); background: #0b1030; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(120% 80% at 50% 0%, transparent 30%, rgb(0 0 0 / .35)), linear-gradient(transparent 50%, rgb(0 0 0 / .3)); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
button { font: inherit; color: inherit; cursor: pointer; }

main { z-index: 2; }
header { z-index: 5; }
.results { background: color-mix(in oklch, oklch(18% .03 260) 92%, transparent); }
.search svg { z-index: 1; pointer-events: none; }
main, header { position: relative; width: min(1100px, 100% - 2rem); margin-inline: auto; }
header { padding-top: max(1rem, env(safe-area-inset-top)); display: grid; gap: .75rem; }
.bar { display: flex; gap: .6rem; align-items: center; }
.brand { font-weight: 800; letter-spacing: .02em; display: flex; align-items: center; gap: .4rem; font-size: 1.1rem; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(from var(--glow-a), #ffd36b, #ff7a59, #7aa8ff, #ffd36b); animation: spin 6s linear infinite; }
@keyframes spin { to { --glow-a: 360deg; } }
.glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border-radius: var(--r); box-shadow: 0 10px 40px rgb(0 0 0 / .18); }
.search { position: relative; flex: 1; }
.search input { width: 100%; padding: .8rem 1rem .8rem 2.6rem; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; color: inherit; font: inherit; backdrop-filter: blur(18px); transition: box-shadow .3s, background .3s; }
.search input::placeholder { color: var(--ink-dim); }
.search input:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 60%, transparent); }
.search svg { position: absolute; left: .9rem; top: 50%; translate: 0 -50%; width: 18px; opacity: .7; }
.results { position: absolute; top: calc(100% + .4rem); inset-inline: 0; padding: .35rem; z-index: 10; list-style: none; padding-left: .35rem; }
.results[hidden] { display: none; }
.results li { padding: .6rem .8rem; border-radius: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 1rem; animation: pop .25s var(--spring) both; }
.results li small { color: var(--ink-dim); }
.results li[aria-selected="true"], .results li:hover { background: color-mix(in oklch, white 14%, transparent); }
.results li.none { cursor: default; color: var(--ink-dim); }
.btn { display: grid; place-items: center; min-width: 44px; height: 44px; padding: 0 .9rem; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px); transition: transform .25s var(--spring), background .2s; will-change: transform; font-weight: 700; }
.btn:hover { background: color-mix(in oklch, white 16%, var(--glass)); }
.btn:active { scale: .94; }
.btn svg { width: 20px; }
.btn[aria-pressed="true"] { color: var(--accent); }
.units { display: flex; padding: 3px; gap: 2px; position: relative; }
.units button { all: unset; cursor: pointer; padding: .45rem .75rem; border-radius: 999px; position: relative; z-index: 1; font-weight: 700; transition: color .3s; }
.units button[aria-checked="true"] { color: #10142a; }
.units .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--ink); transition: translate .45s var(--spring); }
.units[data-u="f"] .thumb { translate: 100% 0; }
.chips { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.chip { display: flex; align-items: center; gap: .3rem; padding: .35rem .5rem .35rem .85rem; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); white-space: nowrap; backdrop-filter: blur(14px); animation: pop .4s var(--spring) both; }
.chip[aria-current="true"] { background: color-mix(in oklch, var(--accent) 35%, var(--glass)); }
.chip button { all: unset; cursor: pointer; }
.chip .x { opacity: .5; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
.chip .x:hover { opacity: 1; background: #fff2; }
.chip:empty { display: none; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.94); } }

main { padding-block: 1rem 4rem; display: grid; gap: 1rem; container-type: inline-size; }
.hero { text-shadow: 0 1px 14px rgb(0 0 0 / .45); padding: clamp(1rem, 4cqw, 2.5rem) 0 .5rem; display: grid; gap: .25rem; text-align: center; justify-items: center; transform-style: preserve-3d; }
.place { display: flex; align-items: center; gap: .6rem; font-size: clamp(1.2rem, 1rem + 1.5vw, 1.9rem); font-weight: 650; }
.place .btn { height: 36px; min-width: 36px; padding: 0; }
.when { color: color-mix(in oklch, var(--ink) 85%, transparent); font-variant-numeric: tabular-nums; }
.temp { font-size: var(--fs-hero); font-weight: 200; line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; position: relative; text-shadow: 0 6px 40px rgb(0 0 0 / .3); translate: calc(var(--px, 0) * -10px) calc(var(--py, 0) * -10px); }
.temp sup { font-size: .35em; vertical-align: top; position: relative; top: .25em; font-weight: 300; }
.cond { font-size: clamp(1.1rem, 1rem + .8vw, 1.6rem); display: flex; gap: .5rem; align-items: center; }
.cond .ico { font-size: 1.4em; display: inline-block; animation: bob 4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(4deg); } }
.hl { color: color-mix(in oklch, var(--ink) 85%, transparent); }

.scrub { padding: 1rem 1.25rem 1.1rem; display: grid; gap: .5rem; }
.scrub-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
.scrub-top h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-dim); font-weight: 700; }
.scrub-top .btn { height: 38px; gap: .4rem; display: flex; align-items: center; }
.chartwrap { position: relative; touch-action: pan-y; cursor: ew-resize; }
svg.chart { width: 100%; height: auto; aspect-ratio: 800 / 220; min-height: 150px; display: block; overflow: visible; }
.chart .line { fill: none; stroke: url(#lg); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); }
.chart .line.draw { animation: draw 1.4s cubic-bezier(.2, .7, .2, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .area { fill: url(#ag); opacity: 0; transition: opacity 1s .6s; }
.chart .area.on { opacity: 1; }
.chart .tick { fill: var(--ink-dim); font-size: 11px; text-anchor: middle; }
.chart .grid { stroke: #fff2; stroke-dasharray: 2 5; }
.chart .cur { stroke: #fff9; stroke-width: 1.5; }
.chart .dot { fill: #fff; stroke: var(--accent); stroke-width: 4; filter: drop-shadow(0 0 8px var(--accent)); }
.chart .bubble { fill: #fff; font-weight: 700; font-size: 13px; text-anchor: middle; paint-order: stroke; stroke: #0006; stroke-width: 3px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; cursor: grab; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #0b1030, #e0684f 25%, #6ab4f5 50%, #e0684f 75%, #0b1030); box-shadow: inset 0 0 0 1px #fff3; }
input[type=range]::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #0b1030, #e0684f 25%, #6ab4f5 50%, #e0684f 75%, #0b1030); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); box-shadow: 0 4px 14px #0006; transition: scale .2s var(--spring); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); }
input[type=range]:active::-webkit-slider-thumb { scale: 1.25; }
input[type=range]:active { cursor: grabbing; }
.hint { font-size: .8rem; color: var(--ink-dim); text-align: center; }

.grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
@container (min-width: 760px) { .grid { grid-template-columns: 1.1fr 1fr; align-items: start; } }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; container-type: inline-size; }
@container (min-width: 420px) { .stat { padding: 1.1rem; } }
.stat { padding: .9rem; display: grid; gap: .15rem; transition: transform .35s var(--spring); }
.stat:hover { transform: translateY(-3px); }
.stat span { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); font-weight: 700; }
.stat b { font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .bar2 { height: 5px; border-radius: 5px; background: #fff2; overflow: hidden; margin-top: .3rem; }
.stat .bar2 i { display: block; height: 100%; width: var(--v, 0%); background: var(--accent); border-radius: inherit; transition: width .5s var(--spring); }
.days { padding: .5rem; list-style: none; }
.days h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-dim); padding: .6rem .7rem; }
.day { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 3.2rem 1.8rem 2.6rem 1fr 2.6rem; gap: .6rem; align-items: center; width: 100%; padding: .65rem .7rem; border-radius: 16px; cursor: pointer; transition: background .2s; font-variant-numeric: tabular-nums; }
.day:hover { background: #fff1; }
.day[aria-pressed="true"] { background: color-mix(in oklch, var(--accent) 22%, transparent); }
.day:focus-visible { outline: 3px solid var(--accent); }
.day .lo { color: var(--ink-dim); text-align: right; }
.day .hi { text-align: left; }
.range { height: 6px; border-radius: 6px; background: #fff2; position: relative; }
.range i { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #6ab4f5, #ffd36b, #ff7a59); transform-origin: left; animation: grow .9s var(--spring) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes grow { from { scale: 0 1; } }
.ico { line-height: 1; }

footer { position: relative; z-index: 2; text-align: center; color: var(--ink-dim); font-size: .8rem; padding: 0 1rem 2rem; }
footer a { color: inherit; }
.banner { padding: .7rem 1rem; text-align: center; font-size: .9rem; background: color-mix(in oklch, oklch(70% .15 50) 35%, var(--glass)); }
.banner[hidden] { display: none; }

.reveal { animation: rise .8s var(--spring) both; animation-delay: calc(var(--d, 0) * 90ms); }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); filter: blur(6px); } }
.skeleton .temp, .skeleton .place span, .skeleton .cond, .skeleton .when { color: transparent; text-shadow: none; border-radius: 16px; background: linear-gradient(90deg, #fff1, #fff4, #fff1) 0 0 / 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
::view-transition-old(root) { animation: .35s ease both vt-out; }
::view-transition-new(root) { animation: .5s ease both vt-in; }
@keyframes vt-out { to { opacity: 0; scale: .98; filter: blur(8px); } }
@keyframes vt-in { from { opacity: 0; scale: 1.02; filter: blur(8px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .chart .line { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>

<header>
  <div class="bar">
    <div class="brand"><i></i>Skyline</div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Search for a city</label>
      <input id="q" type="search" placeholder="Search a city…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="res" aria-autocomplete="list">
      <ul id="res" class="results glass" role="listbox" hidden></ul>
    </div>
    <button class="btn magnetic" id="geo" aria-label="Use my location" title="Use my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
    <div class="units btn glass" id="units" role="radiogroup" aria-label="Temperature unit" data-u="c">
      <span class="thumb"></span>
      <button role="radio" aria-checked="true" data-u="c">°C</button>
      <button role="radio" aria-checked="false" data-u="f">°F</button>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Saved cities"></nav>
</header>

<div class="banner glass" id="banner" role="status" hidden style="width:min(1100px,100% - 2rem);margin:.75rem auto 0;position:relative;z-index:2"></div>

<main id="app" class="skeleton">
  <section class="hero" id="hero" aria-live="polite">
    <div class="place"><span id="city">Loading…</span><button class="btn magnetic" id="save" aria-pressed="false" aria-label="Save city" title="Save city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path id="star" d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button></div>
    <div class="when" id="when">&nbsp;</div>
    <div class="temp" id="temp" aria-label="Temperature">--<sup>°</sup></div>
    <div class="cond"><span class="ico" id="ico">☁️</span><span id="cond">&nbsp;</span></div>
    <div class="hl" id="hl">&nbsp;</div>
  </section>

  <section class="scrub glass reveal" style="--d:1" aria-labelledby="sh">
    <div class="scrub-top"><h2 id="sh">Scrub the day</h2>
      <button class="btn magnetic" id="play" aria-pressed="false"><span id="playtxt">▶ Play day</span></button></div>
    <div class="chartwrap" id="cw"><svg class="chart" id="chart" viewBox="0 0 800 220" role="img" aria-label="Hourly temperature chart"></svg></div>
    <label class="sr" for="time">Time of day</label>
    <input type="range" id="time" min="0" max="1439" step="5" value="720" aria-valuetext="">
    <p class="hint">Drag the chart or slider · ← → keys to scrub · Shift for hours</p>
  </section>

  <div class="grid">
    <section class="stats reveal" style="--d:2" id="stats" aria-label="Conditions at selected time"></section>
    <section class="days glass reveal" style="--d:3" aria-labelledby="dh"><h2 id="dh">7-day forecast</h2><div id="days"></div></section>
  </div>
</main>
<footer>Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Skyline</footer>

<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- weather code metadata ---------- */
function wx(code, day = true) {
  const m = (t, i, extra = {}) => ({ t, i, cloud: .2, rain: 0, snow: 0, fog: 0, storm: 0, ...extra });
  if (code === 0) return m('Clear sky', day ? '☀️' : '🌙', { cloud: 0 });
  if (code === 1) return m('Mostly clear', day ? '🌤️' : '🌙', { cloud: .2 });
  if (code === 2) return m('Partly cloudy', day ? '⛅' : '☁️', { cloud: .5 });
  if (code === 3) return m('Overcast', '☁️', { cloud: .95 });
  if (code === 45 || code === 48) return m('Foggy', '🌫️', { cloud: .6, fog: 1 });
  if (code >= 51 && code <= 57) return m('Drizzle', '🌦️', { cloud: .8, rain: .3 });
  if (code >= 61 && code <= 67) return m('Rain', '🌧️', { cloud: .9, rain: code >= 65 ? 1 : .6 });
  if (code >= 71 && code <= 77) return m('Snow', '🌨️', { cloud: .85, snow: code === 75 ? 1 : .6 });
  if (code >= 80 && code <= 82) return m('Rain showers', '🌦️', { cloud: .8, rain: code === 82 ? 1 : .6 });
  if (code === 85 || code === 86) return m('Snow showers', '🌨️', { cloud: .85, snow: .8 });
  if (code >= 95) return m('Thunderstorm', '⛈️', { cloud: 1, rain: .9, storm: 1 });
  return m('Unknown', '🌡️');
}

/* ---------- state ---------- */
const S = {
  city: null, data: null, unit: store.get('unit', 'c'), day: 0, min: 720,
  saved: store.get('cities', []), playing: false, demo: false
};
const DEFAULT = { name: 'Stockholm', country: 'Sweden', lat: 59.3293, lon: 18.0686 };

/* ---------- data ---------- */
const hourlyKeys = 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,weather_code,cloud_cover,wind_speed_10m,is_day,uv_index';
async function fetchForecast(c) {
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&hourly=${hourlyKeys}&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&current=temperature_2m&timezone=auto&forecast_days=7`;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(u, { signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    return normalize(await r.json());
  } finally { clearTimeout(to); }
}
function normalize(j) {
  const h = j.hourly, d = j.daily;
  const now = j.current?.time ?? h.time[0];
  return {
    tz: j.timezone, now,
    h: { t: h.temperature_2m, f: h.apparent_temperature, rh: h.relative_humidity_2m, pp: h.precipitation_probability, code: h.weather_code, cc: h.cloud_cover, w: h.wind_speed_10m, day: h.is_day, uv: h.uv_index },
    d: d.time.map((date, i) => ({ date, code: d.weather_code[i], hi: d.temperature_2m_max[i], lo: d.temperature_2m_min[i], rise: toMin(d.sunrise[i]), set: toMin(d.sunset[i]) }))
  };
}
const toMin = s => { const [h, m] = s.split('T')[1].split(':').map(Number); return h * 60 + m; };
function demoData() {
  const base = new Date(); const pad = n => String(n).padStart(2, '0');
  const h = { t: [], f: [], rh: [], pp: [], code: [], cc: [], w: [], day: [], uv: [] }, d = [];
  const codes = [1, 2, 3, 61, 80, 2, 0];
  for (let i = 0; i < 7; i++) {
    const dt = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    const date = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    const avg = 14 + Math.sin(i * 1.3) * 3, code = codes[i];
    let hi = -99, lo = 99;
    for (let k = 0; k < 24; k++) {
      const t = avg + Math.sin((k - 9) / 24 * Math.PI * 2) * 5 + Math.sin(i + k * .3) * .5;
      hi = Math.max(hi, t); lo = Math.min(lo, t);
      h.t.push(+t.toFixed(1)); h.f.push(+(t - 1.5).toFixed(1)); h.rh.push(Math.round(65 + Math.cos(k / 24 * 6.28) * 15));
      h.pp.push(code >= 60 ? 70 : 10); h.code.push(code); h.cc.push(code >= 3 ? 85 : 30); h.w.push(+(10 + Math.sin(k / 3) * 4).toFixed(1));
      h.day.push(k >= 6 && k < 19 ? 1 : 0); h.uv.push(k > 8 && k < 17 ? +(4 * Math.sin((k - 8) / 9 * Math.PI)).toFixed(1) : 0);
    }
    d.push({ date, code, hi: +hi.toFixed(1), lo: +lo.toFixed(1), rise: 6 * 60 + 20, set: 19 * 60 + 10 });
  }
  const n = new Date();
  return { tz: 'local', now: `${d[0].date}T${pad(n.getHours())}:${pad(n.getMinutes())}`, h, d };
}

/* ---------- unit helpers ---------- */
const T = c => S.unit === 'f' ? c * 9 / 5 + 32 : c;
const W = k => S.unit === 'f' ? k * .621371 : k;
const fmtT = c => Math.round(T(c)) + '°';

/* ---------- sampling at selected minute (interpolated) ---------- */
function sample() {
  const D = S.data, base = S.day * 24, x = S.min / 60, i = Math.floor(x), f = x - i;
  const a = base + clamp(i, 0, 23), b = base + clamp(i + 1, 0, 23);
  const L = k => lerp(D.h[k][a], D.h[k][b], f);
  const day = D.d[S.day];
  const isDay = S.min >= day.rise && S.min <= day.set;
  const near = f < .5 ? a : b;
  return { t: L('t'), f: L('f'), rh: L('rh'), pp: L('pp'), cc: L('cc'), w: L('w'), uv: L('uv'),
    code: D.h.code[near], isDay, day };
}

/* ---------- spring ticker ---------- */
class Spring {
  constructor(v = 0) { this.v = v; this.x = v; this.t = v; }
  step(dt) { const k = 170, c = 22; const a = -k * (this.x - this.t) - c * this.v; this.v += a * dt; this.x += this.v * dt; return this.x; }
  get settled() { return Math.abs(this.x - this.t) < .01 && Math.abs(this.v) < .01; }
}
const tempSpring = new Spring(0);

/* ---------- sky renderer ---------- */
const cv = $('#sky'), g = cv.getContext('2d');
let CW = 0, CH = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  CW = innerWidth; CH = innerHeight;
  cv.width = CW * DPR; cv.height = CH * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars.length = 0; for (let i = 0; i < 160; i++) stars.push({ x: Math.random(), y: Math.random() * .75, r: Math.random() * 1.3 + .3, p: Math.random() * 6.28 });
}
const stars = [];
const clouds = Array.from({ length: 9 }, (_, i) => ({ x: Math.random(), y: .08 + Math.random() * .4, s: .6 + Math.random() * .9, v: .004 + Math.random() * .01, o: Math.random() }));
let drops = [];
const sky = { elev: .5, cloud: .2, rain: 0, snow: 0, fog: 0, storm: 0, mf: .5, sf: .5, night: 0 }; // smoothed render state
let target = { ...sky };
let flash = 0, nextFlash = 3;
const mix = (c1, c2, t) => c1.map((v, i) => lerp(v, c2[i], t));
const PAL = {
  night: [[6, 9, 28], [16, 20, 56]],
  dusk: [[70, 52, 120], [238, 120, 84]],
  day: [[44, 120, 214], [150, 208, 245]]
};
function skyColors(e, cloud, storm) {
  let top, bot;
  if (e <= -.12) { top = PAL.night[0]; bot = PAL.night[1]; }
  else if (e < .22) {
    const t = (e + .12) / .34;
    if (t < .5) { top = mix(PAL.night[0], PAL.dusk[0], t * 2); bot = mix(PAL.night[1], PAL.dusk[1], t * 2); }
    else { top = mix(PAL.dusk[0], PAL.day[0], (t - .5) * 2); bot = mix(PAL.dusk[1], PAL.day[1], (t - .5) * 2); }
  } else { top = PAL.day[0]; bot = PAL.day[1]; }
  const gray = clamp(cloud * .55 + storm * .3, 0, .8), lum = lerp(1, .55, storm);
  const dull = c => { const l = (c[0] + c[1] + c[2]) / 3 * .85; return mix(c, [l, l + 4, l + 10], gray).map(v => v * lum); };
  return [dull(top), dull(bot)];
}
const rgb = c => `rgb(${c[0] | 0} ${c[1] | 0} ${c[2] | 0})`;

function setSkyTarget(s) {
  const D = S.day, d = s.day, m = S.min;
  const w = wx(s.code, s.isDay);
  let elev;
  if (s.isDay) { const f = (m - d.rise) / (d.set - d.rise); elev = Math.sin(f * Math.PI); target.sf = f; }
  else {
    const len = 1440 - d.set + d.rise;
    const since = m >= d.set ? m - d.set : m + 1440 - d.set;
    target.mf = since / len; elev = -Math.sin(clamp(since / len, 0, 1) * Math.PI);
  }
  // smooth twilight across the horizon: use signed distance to sunrise/sunset
  const edge = Math.min(Math.abs(m - d.rise), Math.abs(m - d.set));
  if (edge < 45) elev = lerp(s.isDay ? .02 : -.02, elev, 0) + (s.isDay ? 1 : -1) * (edge / 45) * .22 - 0 * edge;
  target.elev = elev;
  target.cloud = Math.max(w.cloud, s.cc / 100 * .9); target.rain = w.rain; target.snow = w.snow; target.fog = w.fog; target.storm = w.storm;
  target.night = s.isDay ? 0 : 1;
  target.sf = target.sf ?? .5;
}
function cloudPuff(x, y, r, a, col) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgb(${col} / ${a})`); gr.addColorStop(1, `rgb(${col} / 0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
}
let mx = .5, my = .5, smx = .5, smy = .5, last = performance.now(), running = true;
function frame(now) {
  if (!running) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const k = 1 - Math.pow(.0015, dt);
  for (const key of ['elev', 'cloud', 'rain', 'snow', 'fog', 'storm', 'mf', 'sf']) sky[key] += (target[key] - sky[key]) * k;
  smx += (mx - smx) * .05; smy += (my - smy) * .05;
  document.documentElement.style.setProperty('--px', (smx - .5) * 2);
  document.documentElement.style.setProperty('--py', (smy - .5) * 2);

  // temp ticker
  if (!tempSpring.settled) { tempSpring.step(dt); renderTemp(); }

  const [top, bot] = skyColors(sky.elev, sky.cloud, sky.storm);
  const grd = g.createLinearGradient(0, 0, 0, CH);
  grd.addColorStop(0, rgb(top)); grd.addColorStop(1, rgb(bot));
  g.fillStyle = grd; g.fillRect(0, 0, CW, CH);

  const nightAmt = clamp((-sky.elev + .1) * 4, 0, 1) * (1 - sky.cloud * .7);
  if (nightAmt > .01) for (const s of stars) {
    const tw = .6 + .4 * Math.sin(now / 700 + s.p);
    g.fillStyle = `rgb(255 255 255 / ${nightAmt * tw})`;
    g.beginPath(); g.arc(s.x * CW + (smx - .5) * -14 * s.r, s.y * CH, s.r, 0, 6.283); g.fill();
  }

  // sun / moon along an arc
  const ax = CW / 2, ar = Math.min(CW * .46, 520), horizon = CH * .62, ah = CH * .5;
  const place = f => ({ x: ax + Math.cos(Math.PI * (1 - clamp(f, 0, 1))) * ar + (smx - .5) * -20, y: horizon - Math.sin(Math.PI * clamp(f, 0, 1)) * ah });
  const sun = place(sky.sf), moon = place(sky.mf);
  const sunVis = clamp(sky.elev * 6 + 1, 0, 1) * (1 - sky.cloud * .55);
  if (sunVis > .01 && S.curDay !== false) {
    const warm = clamp(1 - sky.elev * 2.2, 0, 1);
    const col = `${255} ${lerp(235, 140, warm) | 0} ${lerp(190, 70, warm) | 0}`;
    cloudPuff(sun.x, sun.y, 340, .45 * sunVis, col);
    g.fillStyle = `rgb(${col} / ${sunVis})`; g.beginPath(); g.arc(sun.x, sun.y, 34, 0, 6.283); g.fill();
  }
  const moonVis = clamp(-sky.elev * 6 + 1, 0, 1) * (1 - sky.cloud * .75);
  if (moonVis > .01) {
    cloudPuff(moon.x, moon.y, 200, .25 * moonVis, '190 210 255');
    g.fillStyle = `rgb(235 240 255 / ${moonVis})`; g.beginPath(); g.arc(moon.x, moon.y, 24, 0, 6.283); g.arc(moon.x + 10, moon.y - 6, 21, 0, 6.283); g.fill('evenodd');
  }

  // horizon glow
  const hg = g.createLinearGradient(0, horizon - 120, 0, CH);
  hg.addColorStop(0, 'rgb(0 0 0 / 0)'); hg.addColorStop(1, `rgb(0 0 0 / ${.25 + nightAmt * .25})`);
  g.fillStyle = hg; g.fillRect(0, horizon - 120, CW, CH);

  // clouds
  const bright = clamp(.55 + sky.elev * .6, .25, 1), shade = lerp(255, 70, sky.storm * .8) * bright;
  const ccol = `${shade | 0} ${(shade * .98) | 0} ${Math.min(255, shade * 1.05) | 0}`;
  const count = Math.round(clouds.length * clamp(sky.cloud * 1.15, 0, 1));
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    c.x += c.v * dt * (reduced.matches ? 0 : 1); if (c.x > 1.3) c.x = -.3;
    const vis = i < count ? 1 : 0; c.o += (vis - c.o) * .03;
    if (c.o < .01) continue;
    const x = c.x * CW + (smx - .5) * -30 * c.s, y = c.y * CH + (smy - .5) * -10, r = 110 * c.s * (CW < 600 ? .7 : 1);
    for (let j = 0; j < 5; j++) cloudPuff(x + (j - 2) * r * .6, y + Math.sin(j * 2) * r * .22, r * (1 - Math.abs(j - 2) * .12), .5 * c.o * (.6 + sky.cloud * .4), ccol);
  }

  // fog
  if (sky.fog > .02) { g.fillStyle = `rgb(220 225 235 / ${sky.fog * .3})`; g.fillRect(0, 0, CW, CH); }

  // precipitation
  const want = Math.round((sky.rain * 260 + sky.snow * 180) * (CW < 600 ? .6 : 1));
  while (drops.length < want) drops.push(newDrop(true));
  if (drops.length > want + 20) drops.length -= 4;
  const wind = 40 + sky.storm * 90;
  for (const d of drops) {
    d.y += d.vy * dt; d.x += (d.snow ? Math.sin(now / 900 + d.p) * 18 : wind * .3) * dt;
    if (d.y > CH) { Object.assign(d, newDrop(false)); }
    if (d.snow) { g.fillStyle = `rgb(255 255 255 / ${d.a * clamp(sky.snow * 2, 0, 1)})`; g.beginPath(); g.arc(d.x, d.y, d.l, 0, 6.283); g.fill(); }
    else { g.strokeStyle = `rgb(200 220 255 / ${d.a * clamp(sky.rain * 1.6, 0, 1)})`; g.lineWidth = 1.2; g.beginPath(); g.moveTo(d.x, d.y); g.lineTo(d.x - wind * .012 * d.l, d.y - d.l); g.stroke(); }
  }
  // lightning
  if (sky.storm > .5 && !reduced.matches) {
    nextFlash -= dt; if (nextFlash < 0) { flash = 1; nextFlash = 2 + Math.random() * 5; }
  }
  if (flash > .01) { g.fillStyle = `rgb(220 230 255 / ${flash * .55})`; g.fillRect(0, 0, CW, CH); flash *= Math.pow(.02, dt); }
  requestAnimationFrame(frame);
}
function newDrop(init) {
  const snow = sky.snow > sky.rain;
  return snow ? { snow: 1, x: Math.random() * CW, y: init ? Math.random() * CH : -10, vy: 40 + Math.random() * 60, l: 1 + Math.random() * 2.5, a: .5 + Math.random() * .5, p: Math.random() * 6 }
    : { snow: 0, x: Math.random() * CW, y: init ? Math.random() * CH : -20, vy: 700 + Math.random() * 500, l: 10 + Math.random() * 16, a: .2 + Math.random() * .4, p: 0 };
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running) { last = performance.now(); requestAnimationFrame(frame); }
});
addEventListener('pointermove', e => { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; }, { passive: true });

/* ---------- rendering UI ---------- */
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const dayName = (date, i) => i === 0 ? 'Today' : WD[new Date(date + 'T12:00').getDay()];
const fmtClock = m => { const h = Math.floor(m / 60) % 24, mm = Math.floor(m % 60); return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; };
function renderTemp() { $('#temp').innerHTML = `${Math.round(T(tempSpring.x)).toString().replace('-', '−')}<sup>°</sup>`; }

let lastCode = null;
function renderLive() {
  const s = sample(), w = wx(s.code, s.isDay), d = s.day;
  tempSpring.t = s.t; if (tempSpring.settled) renderTemp();
  $('#cond').textContent = w.t;
  if (lastCode !== w.i) { $('#ico').textContent = w.i; lastCode = w.i; }
  $('#when').textContent = `${dayName(d.date, S.day) === 'Today' ? 'Today' : new Date(d.date + 'T12:00').toLocaleDateString(undefined, { weekday: 'long' })} · ${fmtClock(S.min)}${isNowSel() ? ' · now' : ''}`;
  $('#hl').textContent = `H ${fmtT(d.hi)}  ·  L ${fmtT(d.lo)}`;
  const unitW = S.unit === 'f' ? 'mph' : 'km/h';
  const stats = [
    ['Feels like', fmtT(s.f), null], ['Humidity', Math.round(s.rh) + '%', s.rh],
    ['Wind', Math.round(W(s.w)) + ' ' + unitW, clamp(s.w / 60 * 100, 0, 100)], ['Rain chance', Math.round(s.pp) + '%', s.pp],
    ['UV index', s.uv.toFixed(1), clamp(s.uv / 11 * 100, 0, 100)], ['Daylight', `${fmtClock(d.rise)} – ${fmtClock(d.set)}`, null]
  ];
  const el = $('#stats');
  if (el.children.length !== stats.length) {
    el.innerHTML = stats.map(([l]) => `<div class="stat glass"><span>${l}</span><b></b><div class="bar2"><i></i></div></div>`).join('');
  }
  stats.forEach(([, v, p], i) => {
    const c = el.children[i]; c.querySelector('b').textContent = v;
    const bar = c.querySelector('.bar2'); bar.style.display = p == null ? 'none' : ''; c.querySelector('i').style.setProperty('--v', (p ?? 0) + '%');
  });
  const sl = $('#time'); sl.value = S.min; sl.setAttribute('aria-valuetext', `${fmtClock(S.min)}, ${fmtT(s.t)}, ${w.t}`);
  setSkyTarget(s);
  document.title = `${fmtT(s.t)} ${w.t} · ${S.city.name} — Skyline`;
  updateCursor(s);
}
function isNowSel() { return S.day === 0 && Math.abs(S.min - nowMin()) < 8; }
function nowMin() { const t = S.data.now.split('T')[1].split(':'); return +t[0] * 60 + +t[1]; }

/* chart */
const VW = 800, VH = 220, PADX = 14, PT = 34, PB = 28;
let chartGeom = null;
function renderChart(animate) {
  const base = S.day * 24, vals = S.data.h.t.slice(base, base + 24).map(T);
  const mn = Math.min(...vals) - 1, mxv = Math.max(...vals) + 1;
  const X = h => PADX + h / 23 * (VW - PADX * 2), Y = v => PT + (1 - (v - mn) / (mxv - mn)) * (VH - PT - PB);
  const pts = vals.map((v, i) => [X(i), Y(v)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += `C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  chartGeom = { X, Y, mn, mxv, vals };
  const ticks = [0, 3, 6, 9, 12, 15, 18, 21].map(h => `<text class="tick" x="${X(h)}" y="${VH - 6}">${String(h).padStart(2, '0')}</text>`).join('');
  const grid = [0, .5, 1].map(f => `<line class="grid" x1="${PADX}" x2="${VW - PADX}" y1="${PT + f * (VH - PT - PB)}" y2="${PT + f * (VH - PT - PB)}"/>`).join('');
  $('#chart').innerHTML = `<defs>
    <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#7aa8ff"/><stop offset=".5" stop-color="#ffd36b"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    ${grid}${ticks}<path class="area" d="${d}L${X(23)},${VH - PB}L${X(0)},${VH - PB}Z"/>
    <path class="line" id="ln" d="${d}"/>
    <line class="cur" id="cl" y1="${PT - 10}" y2="${VH - PB}"/><circle class="dot" id="cd" r="7" vector-effect="non-scaling-stroke"/><text class="bubble" id="cb" y="14"></text>`;
  const ln = $('#ln'), len = Math.ceil(ln.getTotalLength());
  ln.style.setProperty('--len', len);
  if (animate && !reduced.matches) { ln.classList.add('draw'); } else { ln.style.strokeDashoffset = 0; }
  requestAnimationFrame(() => $('#chart .area').classList.add('on'));
  updateCursor(sample());
}
function updateCursor(s) {
  if (!chartGeom) return;
  const h = Math.min(S.min / 60, 23), x = chartGeom.X(h), y = chartGeom.Y(T(s.t));
  const cl = $('#cl'), cd = $('#cd'), cb = $('#cb'); if (!cl) return;
  cl.setAttribute('x1', x); cl.setAttribute('x2', x); cd.setAttribute('cx', x); cd.setAttribute('cy', y);
  cb.setAttribute('x', clamp(x, 30, VW - 30)); cb.textContent = fmtT(s.t);
}

/* days */
function renderDays(animate = true) {
  const D = S.data.d, mn = Math.min(...D.map(d => d.lo)), mxv = Math.max(...D.map(d => d.hi));
  $('#days').innerHTML = D.map((d, i) => {
    const l = (d.lo - mn) / (mxv - mn) * 100, r = (d.hi - mn) / (mxv - mn) * 100;
    return `<button class="day" data-i="${i}" aria-pressed="${i === S.day}" aria-label="${dayName(d.date, i)}, ${wx(d.code).t}, high ${fmtT(d.hi)}, low ${fmtT(d.lo)}">
      <span>${dayName(d.date, i)}</span><span class="ico">${wx(d.code).i}</span><span class="lo">${fmtT(d.lo)}</span>
      <span class="range"><i style="left:${l}%;width:${Math.max(r - l, 6)}%;--i:${i};${animate ? '' : 'animation:none'}"></i></span><span class="hi">${fmtT(d.hi)}</span></button>`;
  }).join('');
}

/* ---------- scrubbing interactions ---------- */
const slider = $('#time'), cw = $('#cw');
function setMin(m) { S.min = clamp(Math.round(m), 0, 1439); renderLive(); }
slider.addEventListener('input', () => { stopPlay(); setMin(+slider.value); });
function chartPointer(e) {
  const r = $('#chart').getBoundingClientRect();
  const fx = clamp((e.clientX - r.left) / r.width * VW, PADX, VW - PADX);
  setMin((fx - PADX) / (VW - PADX * 2) * 23 * 60);
}
cw.addEventListener('pointerdown', e => { stopPlay(); cw.setPointerCapture(e.pointerId); chartPointer(e); cw.dragging = true; });
cw.addEventListener('pointermove', e => { if (cw.dragging) chartPointer(e); });
cw.addEventListener('pointerup', () => cw.dragging = false);
cw.addEventListener('pointercancel', () => cw.dragging = false);
addEventListener('keydown', e => {
  if (e.target.matches('input[type=search]') || e.target === slider) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { stopPlay(); setMin(S.min + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 60 : 15)); e.preventDefault(); }
});
let raf = 0;
function stopPlay() { S.playing = false; cancelAnimationFrame(raf); $('#play').setAttribute('aria-pressed', 'false'); $('#playtxt').textContent = '▶ Play day'; }
$('#play').addEventListener('click', () => {
  if (S.playing) return stopPlay();
  S.playing = true; $('#play').setAttribute('aria-pressed', 'true'); $('#playtxt').textContent = '⏸ Pause';
  if (S.min > 1380) S.min = 0;
  let t0 = performance.now(), m0 = S.min;
  const tick = now => {
    if (!S.playing) return;
    const m = m0 + (now - t0) / 1000 * 160; // full day ≈ 9s
    if (m >= 1439) { setMin(1439); return stopPlay(); }
    setMin(m); raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
});
$('#days').addEventListener('click', e => {
  const b = e.target.closest('.day'); if (!b) return;
  stopPlay(); S.day = +b.dataset.i;
  if (S.day === 0) S.min = nowMin();
  [...document.querySelectorAll('.day')].forEach(x => x.setAttribute('aria-pressed', x === b));
  renderChart(true); renderLive();
});

/* units */
$('#units').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.unit = b.dataset.u; store.set('unit', S.unit); applyUnit();
});
function applyUnit() {
  const u = $('#units'); u.dataset.u = S.unit;
  u.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.u === S.unit));
  if (!S.data) return;
  renderTemp(); renderDays(false); renderChart(false); renderLive();
}

/* ---------- city loading ---------- */
function showBanner(msg) { const b = $('#banner'); b.textContent = msg || ''; b.hidden = !msg; }
async function loadCity(c, { transition = true } = {}) {
  S.city = c; $('#app').classList.add('skeleton'); $('#city').textContent = c.name;
  let data, demo = false;
  try { data = await fetchForecast(c); showBanner(''); }
  catch (err) {
    data = demoData(); demo = true;
    showBanner(navigator.onLine ? 'Couldn’t reach the weather service — showing demo data.' : 'You’re offline — showing demo data.');
  }
  const apply = () => {
    S.data = data; S.demo = demo; S.day = 0; S.min = nowMin();
    $('#app').classList.remove('skeleton');
    $('#city').textContent = c.name + (c.country ? `, ${c.country}` : '') + (demo ? ' (demo)' : '');
    tempSpring.x = tempSpring.t = sample().t - 8; tempSpring.v = 0;
    renderDays(); renderChart(true); renderLive(); renderChips();
    document.querySelectorAll('.hero > *').forEach((n, i) => { n.classList.remove('reveal'); void n.offsetWidth; n.style.setProperty('--d', i); n.classList.add('reveal'); });
    store.set('last', c);
  };
  if (transition && document.startViewTransition && !reduced.matches) { try { await document.startViewTransition(apply).finished; } catch { } }
  else apply();
}

/* saved cities */
const sameCity = (a, b) => Math.abs(a.lat - b.lat) < .05 && Math.abs(a.lon - b.lon) < .05;
function renderChips() {
  $('#chips').innerHTML = S.saved.map((c, i) => `<span class="chip" ${sameCity(c, S.city) ? 'aria-current="true"' : ''}><button data-go="${i}">${esc(c.name)}</button><button class="x" data-rm="${i}" aria-label="Remove ${esc(c.name)}">✕</button></span>`).join('');
  const saved = S.saved.some(c => sameCity(c, S.city));
  const sv = $('#save'); sv.setAttribute('aria-pressed', saved); sv.setAttribute('aria-label', saved ? 'Remove from saved' : 'Save city');
  $('#star').setAttribute('fill', saved ? 'currentColor' : 'none');
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
$('#chips').addEventListener('click', e => {
  const go = e.target.closest('[data-go]'), rm = e.target.closest('[data-rm]');
  if (go) loadCity(S.saved[+go.dataset.go]);
  if (rm) { S.saved.splice(+rm.dataset.rm, 1); store.set('cities', S.saved); renderChips(); }
});
$('#save').addEventListener('click', () => {
  const i = S.saved.findIndex(c => sameCity(c, S.city));
  if (i >= 0) S.saved.splice(i, 1); else S.saved.push({ name: S.city.name, country: S.city.country, lat: S.city.lat, lon: S.city.lon });
  store.set('cities', S.saved); renderChips();
});

/* geolocation */
$('#geo').addEventListener('click', () => {
  const fallback = async why => {
    try {
      const j = await (await fetch('https://ipwho.is/')).json();
      if (!j.success) throw 0;
      showBanner('Using approximate location from your network.');
      loadCity({ name: j.city || 'My location', country: j.country || '', lat: j.latitude, lon: j.longitude });
    } catch { showBanner(why); }
  };
  if (!navigator.geolocation) return fallback('Geolocation isn’t supported — search for a city instead.');
  showBanner('Locating you…');
  navigator.geolocation.getCurrentPosition(async p => {
    const { latitude: lat, longitude: lon } = p.coords;
    let name = 'My location', country = '';
    try {
      const r = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${lat.toFixed(1)},${lon.toFixed(1)}&count=1`)).json();
      if (r.results?.[0]) { name = r.results[0].name; country = r.results[0].country || ''; }
    } catch { }
    loadCity({ name, country, lat, lon });
  }, err => err.code === 1 ? fallback('Location permission denied — search for a city instead.') : fallback('Couldn’t get your location — search for a city instead.'), { timeout: 10000, maximumAge: 600000 });
});

/* search autocomplete */
const q = $('#q'), res = $('#res');
let sTimer, sSeq = 0, items = [], active = -1;
function closeRes() { res.hidden = true; q.setAttribute('aria-expanded', 'false'); active = -1; }
function paint() {
  res.innerHTML = items.length ? items.map((c, i) => `<li role="option" id="o${i}" data-i="${i}" aria-selected="${i === active}"><span>${esc(c.name)}</span><small>${esc([c.admin1, c.country].filter(Boolean).join(', '))}</small></li>`).join('') : '<li class="none">No matches</li>';
  res.hidden = false; q.setAttribute('aria-expanded', 'true');
  q.setAttribute('aria-activedescendant', active >= 0 ? 'o' + active : '');
}
q.addEventListener('input', () => {
  clearTimeout(sTimer); const v = q.value.trim();
  if (v.length < 2) return closeRes();
  sTimer = setTimeout(async () => {
    const my = ++sSeq;
    try {
      const j = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=en`)).json();
      if (my !== sSeq) return;
      items = (j.results || []).map(r => ({ name: r.name, country: r.country, admin1: r.admin1, lat: r.latitude, lon: r.longitude })); active = -1; paint();
    } catch { items = []; showBanner('Search unavailable right now.'); }
  }, 250);
});
function pick(i) { const c = items[i]; if (!c) return; closeRes(); q.value = ''; q.blur(); loadCity({ name: c.name, country: c.country, lat: c.lat, lon: c.lon }); }
q.addEventListener('keydown', e => {
  if (res.hidden) return;
  if (e.key === 'ArrowDown') { active = (active + 1) % items.length; paint(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { active = (active - 1 + items.length) % items.length; paint(); e.preventDefault(); }
  else if (e.key === 'Enter') { pick(active >= 0 ? active : 0); e.preventDefault(); }
  else if (e.key === 'Escape') closeRes();
});
res.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) pick(+li.dataset.i); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) closeRes(); });

/* magnetic buttons */
document.querySelectorAll('.magnetic').forEach(b => {
  b.addEventListener('pointermove', e => {
    if (reduced.matches || e.pointerType === 'touch') return;
    const r = b.getBoundingClientRect();
    b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .25}px, ${(e.clientY - r.top - r.height / 2) * .35}px)`;
  });
  b.addEventListener('pointerleave', () => b.style.transform = '');
});

/* hero tilt */
const hero = $('#hero');
hero.addEventListener('pointermove', e => {
  if (reduced.matches || e.pointerType === 'touch') return;
  const r = hero.getBoundingClientRect();
  hero.style.transform = `perspective(900px) rotateY(${((e.clientX - r.left) / r.width - .5) * 6}deg) rotateX(${-((e.clientY - r.top) / r.height - .5) * 6}deg)`;
});
hero.addEventListener('pointerleave', () => hero.style.transform = '');
hero.style.transition = 'transform .4s ease-out';

/* online/offline */
addEventListener('online', () => S.demo && loadCity(S.city, { transition: false }));
addEventListener('offline', () => showBanner('You’re offline — data may be out of date.'));

/* ---------- boot ---------- */
resize(); applyUnit();
requestAnimationFrame(frame);
loadCity(DEFAULT, { transition: false });
</script>
</body>
</html>
